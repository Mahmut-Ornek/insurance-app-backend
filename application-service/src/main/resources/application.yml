spring:
  application:
    name: application-service

  datasource:
    url: jdbc:mysql://localhost:3306/application_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Istanbul
    username: root
    password: ${DB_PASSWORD}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.xml

server:
  port: 8083

services:
  insurance-app:
    url: http://localhost:8080

  collection-service:
    url: http://localhost:8084