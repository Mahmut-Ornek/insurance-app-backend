spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  application:
    name: batch-service

  datasource:
    url: jdbc:mysql://localhost:3306/batch_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
    username: root
    password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: never # Şemayı Liquibase ile yöneteceğiz
    job:
      enabled: false # Uygulama açılır açılmaz çalıştırma, Scheduler tetikleyecek

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.xml

server:
  port: 8089

services:
  collection-service:
    url: http://localhost:8084
  application-service:
    url: http://localhost:8083
  insurance-app:
    url: http://localhost:8080
  email-service:
    url: http://localhost:8086
  document-service:
    url: http://localhost:8087