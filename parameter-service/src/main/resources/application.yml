spring:
  data:
    redis:
      host: localhost
      port: 6379

  application:
    name: parameter-service

  datasource:
    url: jdbc:mysql://localhost:3306/parameter_db
    username: root
    password: ${DB_PASSWORD}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.xml

server:
  port: 8082